<h1>Keyboard Shortcuts</h1>

<p>Press <kbd>⌘/</kbd> in the main window to open the full shortcuts reference.</p>

<h2>Session panel</h2>
<table>
  <tr><td><kbd>L</kbd></td><td>Launch selected session</td></tr>
  <tr><td><kbd>F</kbd></td><td>Focus selected session</td></tr>
  <tr><td><kbd>B</kbd></td><td>Brief selected session</td></tr>
</table>

<h2>General</h2>
<table>
  <tr><td><kbd>⌘R</kbd></td><td>Register Project</td></tr>
  <tr><td><kbd>⌘,</kbd></td><td>Settings</td></tr>
  <tr><td><kbd>⌘/</kbd></td><td>Keyboard Shortcuts</td></tr>
  <tr><td><kbd>F1</kbd></td><td>Help</td></tr>
  <tr><td><kbd>⌘W</kbd></td><td>Close dialog</td></tr>
  <tr><td><kbd>⌘Q</kbd></td><td>Exit</td></tr>
</table>
